name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types · lint · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  site:
    name: Build · smoke · static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build (server)
        run: npm run build
      - name: Smoke
        run: |
          npx next start -p 3111 &
          SERVER=$!
          for i in $(seq 1 30); do
            sleep 1
            if curl -fsS http://localhost:3111/ >/dev/null 2>&1; then break; fi
          done
          BASE_URL=http://localhost:3111 node scripts/smoke.mjs
          STATUS=$?
          kill $SERVER
          exit $STATUS
        env:
          ALLOW_FRAMING: "true"
      - name: Static export (the free-host artifact)
        run: npm run build:pages
